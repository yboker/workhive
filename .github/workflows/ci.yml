name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gates:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel; rustup resolves it automatically.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # The CLI integration tests run the real binary, whose dependency
      # preflight requires a `tmux` executable. Ubuntu runners ship one;
      # macOS runners do not, so install it there.
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test all targets
        run: cargo test --workspace --all-targets

      - name: Test doctests
        run: cargo test --workspace --doc
